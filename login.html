<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>판다마켓</title>
		<link rel="stylesheet" href="common.css" />
		<link rel="stylesheet" href="auth.css" />
		<link
			rel="stylesheet"
			as="style"
			crossorigin
			href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
	</head>
	<body>
		<main class="userForm_main">
			<a href="/">
				<img src="./image/logo.png" alt="판다마켓 로고" class="user_form_logo" />
			</a>
			<form action="#" class="user_form">
				<label for="email">이메일</label>
				<input type="email" id="email" name="email" placeholder="codeit@email.com" />
				<label for="password">비밀번호</label>
				<div class="input_box">
					<input type="password" id="password" name="password" />
					<img src="./image/btn_visibility_on.png" alt="비밀번호 보기" class="visible_on" />
				</div>
				<button class="login_button">로그인</button>
			</form>
			<div class="simple_login">
				<span>간편 로그인하기</span>
				<ul class="simple_login_list">
					<li>
						<a href="https://www.google.com/">
							<img src="./image/google.png" alt="google login" />
						</a>
					</li>
					<li>
						<a href="https://www.kakaocorp.com/page/">
							<img src="./image/kakao.png" alt="kakao login" />
						</a>
					</li>
				</ul>
			</div>
			<p>판다마켓이 처음이신가요? <a href="/signup.html" class="signup_link">회원가입</a></p>
		</main>
	</body>
</html>
